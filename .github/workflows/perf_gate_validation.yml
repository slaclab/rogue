# Perf gate validation vehicle: materializes the candidate and merge-base refs supplied by a
# workflow_dispatch as two git worktrees inside one job, builds and measures both through
# scripts/perf_gate_ab_runner.py (interleaved measurement rounds, one shared measurement
# implementation reused per leg), evaluates the resulting two-leg record in job against the
# committed baseline sidecar (scripts/perf_gate_evaluator.py,
# docs/plans/perf-ci-hardening/gate-baseline.json), and uploads the record with its verdict as
# one artifact.
#
# A sibling of Rogue Perf Harness (perf_harness.yml), not an extension of it: the harness
# workflow builds and measures exactly one tree per job, and folding a second tree and an
# in-job evaluation step into that workflow would change what every existing harness-campaign
# dispatch measures. This workflow proves the paired same-job mechanism itself, with its own
# frozen branch, its own dispatch inputs, and its own measured cost against the ten minute
# gating budget.
#
# Push-triggered on a dedicated branch pattern (perf-gate/**) so a push to the frozen
# validation branch cannot fire the shared Rogue Integration workflow, matching
# perf_harness.yml's own push-trigger convention. candidate_ref and merge_base_ref are
# required with no default, so a push-triggered run (which carries no dispatch inputs) fails
# the validation step below rather than silently building an empty pair; that failure is
# expected on a push and does not affect a real workflow_dispatch run.
#
# No concurrency block: the shared Rogue Integration workflow cancels an in-progress run on a
# new push to the same ref, and copying that here would silently discard a validation run
# dispatched in close succession with another.
#
# fail-fast: false, matching perf_harness.yml and perf_probe.yml's own precedent, even though
# this workflow declares a single job with no matrix: carried forward so a future matrix
# addition does not reintroduce that failure mode by omission.
#
# Every step below now carries its own timeout-minutes, including the dependency-install
# step, which previously carried none at all and hung for over ninety minutes on two of this
# campaign's own dispatches. The job itself carries a 60 minute backstop, strictly above the
# sum of the two largest step bounds (25 for the paired-run step plus 12 for the
# dependency-install step), so a per-step bound is always what fires first on a hang inside a
# step; the job bound exists only to cut a runaway job short of GitHub's own default ceiling.
# The paired-run step's own bound is unchanged at 25 minutes (1500 seconds); what changed is
# that scripts/perf_gate_ab_runner.py is now given its own --deadline-seconds 1260 (240
# seconds inside that bound), so the runner's own deadline, not this step's timeout, is what
# stops a hang -- and the runner still writes its two-leg record when it does, instead of the
# step timeout killing the job before anything is recorded.
#
# The runner's --deadline-seconds is now partitioned per remaining leg-and-round unit rather
# than handed to every round as the whole remaining budget, with --round-share-floor-seconds
# 180 below which a round is skipped with its own recorded reason and starts no measurement
# subprocess, instead of being started and aborted mid-import on a near-zero share.
#
# The paired-run step now also accepts a validated module set through the modules dispatch
# input, forwarded to the runner as --modules. This exists because
# perf_harness_runner.DEFAULT_PERF_MODULES runs the batcher-combine module (the one benchmark
# that observes frame batching) last of seven inside one measurement invocation, behind the
# UDP packetizer, RSSI, and TCP core benchmarks whose threads were found parked in socket
# waits in captured hang diagnostics -- narrowing the module set lets that observing benchmark
# be measured without waiting behind modules that may never finish. The literal value all
# keeps the runner's own default module set and appends no --modules argument at all.
# ----------------------------------------------------------------------------

name: Rogue Perf Gate Validation

on:
  push:
    branches:
      - "perf-gate/**"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Full 40-character lowercase hex commit sha for the candidate leg. Rejected unless it matches that exact shape."
        required: true
        type: string
      merge_base_ref:
        description: "Full 40-character lowercase hex commit sha for the merge-base leg. Rejected unless it matches that exact shape."
        required: true
        type: string
      mode:
        description: "The run's declared population membership. Rejected unless it is one of the four listed options."
        type: choice
        default: "null"
        options:
          - "null"
          - unrelated
          - seeded-regression
          - forced-inconclusive
      patch_name:
        description: "Seeded-regression patch filename inside docs/plans/perf-ci-hardening/seeded-regressions, applied to the candidate leg only. The literal value none disables patching; any other value must name an existing file with no path separator or parent-directory component."
        type: string
        default: "none"
      patch_magnitude:
        description: "Forwarded to the candidate leg's measurement subprocess as ROGUE_SEEDED_REGRESSION_STRIDE, recorded for provenance. Must be a decimal integer."
        type: string
        default: "0"
      forced_condition:
        description: "Deliberately induce one named evaluator INCONCLUSIVE condition (merge-base-build-failed, metric-absent-from-leg, tree-hash-pair-mismatch) with no change to library source. The literal value none, or any other unrecognized value, is accepted, recorded, and induces nothing."
        type: string
        default: "none"
      rounds:
        description: "Measurement rounds per leg. Must be a decimal integer."
        type: string
        default: "2"
      label:
        description: "Free-text label recorded on the run, declaring its category before the run rather than after seeing its outcome."
        type: string
        default: "none"
      modules:
        description: "The literal value all keeps the gate runner's own default module set. Any other value must be a comma-separated list of tests/perf/test_<name>.py paths, with no path separator beyond that fixed prefix and no parent-directory component. Narrowing the set changes which benchmarks run inside one measurement invocation, and is recorded on the resulting record."
        type: string
        default: "all"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 15
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 10
        with:
          python-version: 3.12
          cache: 'pip'
          cache-dependency-path: 'pip_requirements.txt'

      # Runs before any dependency install so a malformed dispatch costs nothing. Every
      # dispatch input reaches this shell only through the env: block below, never through a
      # template expansion inside run:. On any rejection the offending input's name is printed
      # and the value is withheld (T-04-24), then the job exits non-zero.
      - name: Validate dispatch inputs
        timeout-minutes: 2
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          MERGE_BASE_REF: ${{ inputs.merge_base_ref }}
          MODE: ${{ inputs.mode }}
          PATCH_NAME: ${{ inputs.patch_name }}
          PATCH_MAGNITUDE: ${{ inputs.patch_magnitude }}
          ROUNDS: ${{ inputs.rounds }}
          MODULES: ${{ inputs.modules }}
        run: |
          set -u
          reject() {
            echo "Rejected dispatch input: ${1}"
            exit 1
          }
          sha_pattern='^[0-9a-f]{40}$'
          [[ "${CANDIDATE_REF}" =~ ${sha_pattern} ]] || reject "candidate_ref"
          [[ "${MERGE_BASE_REF}" =~ ${sha_pattern} ]] || reject "merge_base_ref"
          case "${MODE}" in
            null|unrelated|seeded-regression|forced-inconclusive) ;;
            *) reject "mode" ;;
          esac
          [[ "${ROUNDS}" =~ ^[0-9]+$ ]] || reject "rounds"
          [[ "${PATCH_MAGNITUDE}" =~ ^[0-9]+$ ]] || reject "patch_magnitude"
          if [ "${PATCH_NAME}" != "none" ]; then
            case "${PATCH_NAME}" in
              */*) reject "patch_name" ;;
            esac
            case "${PATCH_NAME}" in
              *..*) reject "patch_name" ;;
            esac
            [ -f "docs/plans/perf-ci-hardening/seeded-regressions/${PATCH_NAME}" ] || reject "patch_name"
          fi
          if [ "${MODULES}" != "all" ]; then
            [ -n "${MODULES}" ] || reject "modules"
            module_pattern='^tests/perf/test_[a-z0-9_]+\.py(,tests/perf/test_[a-z0-9_]+\.py)*$'
            [[ "${MODULES}" =~ ${module_pattern} ]] || reject "modules"
            IFS=',' read -ra module_elements <<< "${MODULES}"
            for module_element in "${module_elements[@]}"; do
              [ -f "${module_element}" ] || reject "modules"
            done
          fi
          echo "dispatch inputs validated"

      # This step previously carried no timeout-minutes at all and hung for over ninety
      # minutes on two of this campaign's own dispatches. A step-level bound is the whole
      # diagnostic here: when this step is killed at its bound the job log already ends on
      # the package manager's own last line, which names what it was waiting for, so no
      # extra watchdog is needed for this step. Measured cost for job setup through ccache
      # install is 65 to 80 seconds total (GATE-VALIDATION-SETUP.md), so 12 minutes is
      # roughly nine times the observed figure.
      - name: Install Rogue build dependencies
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev libboost-all-dev bzip2 libbz2-dev
          pip install -r pip_requirements.txt

      # Resolves the same compiler CMake will pick with no -DCMAKE_CXX_COMPILER set, so the
      # ccache key below cannot describe a different toolchain than the one that actually
      # filled it. Copied unchanged from perf_harness.yml.
      - name: Resolve compiler version
        id: compiler-version
        timeout-minutes: 2
        run: echo "version=$(g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      # Identical cache-key design and restore-keys prefix to perf_harness.yml (runner OS +
      # resolved compiler version + a hash of the source tree). Both legs share this one
      # cache directory and one key; the per-leg ccache statistics in the record make the
      # sharing visible.
      - name: Cache ccache directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ steps.compiler-version.outputs.version }}-${{ hashFiles('src/**', 'include/**', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.compiler-version.outputs.version }}-

      # A failed ccache install degrades the run to an uncached build rather than aborting a
      # run that would otherwise produce a usable record. Copied unchanged from
      # perf_harness.yml.
      - name: Install ccache
        continue-on-error: true
        timeout-minutes: 6
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      # The paired run: two git worktrees, two builds, interleaved measurement rounds, one
      # two-leg record. timeout-minutes derived from HARNESS-SETUP.md's measured single-tree
      # figures (151-173 s total job wall time per tree; ccache-warm configure+compile median
      # 8.46 s; setup 55-80 s; measurement 79-84 s across 14 benchmarks): a two-tree,
      # two-interleaved-round build roughly doubles the single-tree total to an expected
      # 300-350 s, so 25 minutes (1500 s) leaves generous headroom for a cold cache on the
      # freshly cut branch and for git-worktree overhead this step's own measured total
      # reconciles against in GATE-VALIDATION-SETUP.md.
      #
      # scripts/perf_gate_ab_runner.py is given --deadline-seconds 1260 below: this step's
      # own 1500 second (25 minute) bound minus 240 seconds of slack for the record write
      # and both worktree removals. The runner's own deadline is what preserves a written
      # record on a hang -- it fires strictly before this step's own timeout could kill the
      # job first, which is the mechanical reason a hang previously produced no evidence.
      - name: Run paired A/B measurement
        timeout-minutes: 25
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          MERGE_BASE_REF: ${{ inputs.merge_base_ref }}
          MODE: ${{ inputs.mode }}
          PATCH_NAME: ${{ inputs.patch_name }}
          PATCH_MAGNITUDE: ${{ inputs.patch_magnitude }}
          FORCED_CONDITION: ${{ inputs.forced_condition }}
          ROUNDS: ${{ inputs.rounds }}
          LABEL: ${{ inputs.label }}
          MODULES: ${{ inputs.modules }}
          HARNESS_CAMPAIGN_BRANCH: ${{ github.ref_name }}
          HARNESS_DISPATCH_INDEX: ${{ github.run_number }}
          PERF_RESULTS_DIR: gate-validation-results/perf-results
          PERF_HARNESS_RESULTS_DIR: gate-validation-results/perf-harness-results
        run: |
          mkdir -p gate-validation-results
          args=(
            --out gate-validation-results/ab-record.json
            --candidate-ref "${CANDIDATE_REF}"
            --merge-base-ref "${MERGE_BASE_REF}"
            --mode "${MODE}"
            --patch-magnitude "${PATCH_MAGNITUDE}"
            --forced-condition "${FORCED_CONDITION}"
            --label "${LABEL}"
            --rounds "${ROUNDS}"
            --patch-dir docs/plans/perf-ci-hardening/seeded-regressions
            --worktree-root "${RUNNER_TEMP}/perf-gate-ab"
            --deadline-seconds 1260  # this step's own 1500 second bound minus 240 seconds of slack
            --round-share-floor-seconds 180  # twice the measured 85.08 second per-round-per-leg median, rounded up
            --hang-diagnostics-dir gate-validation-results/hang-diagnostics
            --hang-diagnostics-lead-seconds 60
            --print-summary
          )
          if [ "${PATCH_NAME}" != "none" ]; then
            args+=(--patch-name "${PATCH_NAME}")
          fi
          if [ "${MODULES}" != "all" ]; then
            args+=(--modules "${MODULES}")
          fi
          python scripts/perf_gate_ab_runner.py "${args[@]}" > gate-validation-results/ab-summary.md

      # Report only: this phase's runs never fail the job on a FAIL verdict
      # (--exit-nonzero-on-fail is intentionally omitted). if: always() so a partial or failed
      # paired run still produces whatever evaluation the evaluator's own INCONCLUSIVE
      # vocabulary can report.
      - name: Evaluate the paired record against the baseline
        if: always()
        timeout-minutes: 5
        run: |
          python scripts/perf_gate_evaluator.py \
            --record gate-validation-results/ab-record.json \
            --baseline docs/plans/perf-ci-hardening/gate-baseline.json \
            --out-json gate-validation-results/verdict.json \
            --out-md gate-validation-results/verdict.md

      # Reuses the runner's own --print-summary output and the evaluator's own --out-md
      # rendering rather than reformatting either in shell. When the paired-run step armed
      # a hang snapshot before it failed, gate-validation-results/hang-diagnostics holds one
      # or more small JSON files: their contents are appended too, so the evidence is
      # readable on the job page even if artifact retention lapses.
      - name: Append run summary to step summary
        if: always()
        timeout-minutes: 3
        run: |
          {
            if [ -f gate-validation-results/ab-summary.md ]; then
              cat gate-validation-results/ab-summary.md
            fi
            if [ -f gate-validation-results/verdict.md ]; then
              cat gate-validation-results/verdict.md
            fi
            if [ -d gate-validation-results/hang-diagnostics ] && [ -n "$(ls -A gate-validation-results/hang-diagnostics 2>/dev/null)" ]; then
              echo "## Hang diagnostics"
              echo
              for f in gate-validation-results/hang-diagnostics/*; do
                echo "### ${f}"
                echo
                echo '```'
                cat "${f}"
                echo '```'
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate validation results
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-validation-results-${{ github.run_id }}
          path: |
            gate-validation-results/ab-record.json
            gate-validation-results/ab-summary.md
            gate-validation-results/verdict.json
            gate-validation-results/verdict.md
            gate-validation-results/hang-diagnostics/**
            ${{ runner.temp }}/perf-gate-ab/results/**
# ----------------------------------------------------------------------------
